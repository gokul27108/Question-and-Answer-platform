<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Open Q&A Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="text-center mb-4">
                    <a href="index.html" class="h2 text-decoration-none text-dark fw-bold">
                        <i class="fa-solid fa-layer-group text-warning"></i> open<strong>qa</strong>
                    </a>
                </div>

                <div class="card border shadow-sm p-4 bg-white">
                    <h2 class="h5 mb-4 fw-bold">Log in to your account</h2>
                    
                    <div id="error-message" class="alert alert-danger" style="display:none;"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">Username or Email</label>
                            <input type="text" class="form-control" id="username" placeholder="e.g. Gokul or gokul@gmail.com" required>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <a href="#" class="small text-decoration-none">Forgot password?</a>
                            </div>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-so-primary w-100 py-2">Log in</button>
                    </form>
                </div>

                <div class="text-center mt-4 small">
                    Don't have an account? <a href="register.html" class="text-decoration-none">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Client Application Scripts -->
    <script src="js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            try {
                errorDiv.style.display = 'none';
                await Api.Auth.login(username, password);
                window.location.href = 'index.html';
            } catch (err) {
                errorDiv.innerText = err.message || 'Login failed. Please check credentials.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
